<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera Tugas - Student Assistance Portal</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#10161f;color:#f1f4f8;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:18px;margin:4px 0 6px} .muted{color:#aab4c3;font-size:13px;line-height:1.5}
  .stage{position:relative;background:#000;border-radius:12px;overflow:hidden;margin-top:12px;min-height:200px}
  video,#hasil{display:block;width:100%;max-height:68vh;object-fit:contain;background:#000}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{flex:1;min-width:130px;padding:14px;font-size:16px;border:0;border-radius:10px;background:#2f6fe4;color:#fff;cursor:pointer}
  button.sek{background:#344057} button:disabled{opacity:.5}
  #pesan{margin-top:12px;padding:10px 12px;border-radius:10px;background:#1b2433;font-size:14px;line-height:1.5}
  #pesan.err{background:#4a1d1d;color:#ffd6d6} #pesan.ok{background:#173a26;color:#d6ffe4}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 Foto karya langsung</h1>
  <div class="muted">Arahkan kamera ke karya Anda (kertas/hasil cetak), pastikan seluruh karya terlihat jelas dan label NIM/nama tertera. Galeri tidak dapat dipakai pada halaman ini.</div>
  <div id="pesan" role="status" aria-live="polite">Memeriksa kode sesi…</div>
  <div class="stage" id="stage" hidden>
    <video id="video" playsinline muted autoplay></video>
    <img id="hasil" alt="Hasil foto" hidden>
  </div>
  <div class="row" id="aksi" hidden>
    <button id="btnAmbil" type="button">Ambil foto</button>
    <button id="btnUlang" class="sek" type="button" hidden>Ulangi</button>
    <button id="btnKirim" type="button" hidden>Kirim foto</button>
  </div>
  <div class="row" id="aksiKamera" hidden><button id="btnBuka" type="button">Izinkan &amp; buka kamera</button></div>
</div>
<script src="./config.js"></script>
<script>
/* ===== SIDIK GAMBAR KARYA (1024 bit = 256 karakter hex) — dihitung di browser =====
   Tujuan: mendeteksi karya yang sama/hampir sama di antara mahasiswa, tahan terhadap
   kompres WhatsApp, simpan ulang, pemotongan (crop) dan perbedaan bingkai/pencahayaan.
   Langkah: (1) gambar diperkecil ke 320x240; (2) kertas karya (area terang) dicari dengan ambang
   Otsu lalu dipotong; (3) pola TINTA (bagian gelap di atas kertas) dihitung per 32x32 sel;
   (4) tiap sel diberi bit 1 jika kerapatan tinta di atas median. Bingkai, infraboard, dan gradasi
   cahaya tidak ikut menentukan sidik. Tidak ada gambar yang dikirim ke pihak ketiga.
   Jika gagal / tidak informatif, hasilnya '' dan upload berjalan seperti biasa. */
function sidikDariRgba_(rgba, w, h) {
  var n = w * h, g = new Float32Array(n), i, x, y;
  for (i = 0; i < n; i++) g[i] = 0.299 * rgba[i * 4] + 0.587 * rgba[i * 4 + 1] + 0.114 * rgba[i * 4 + 2];
  // 1. Otsu
  var hist = new Array(256).fill(0);
  for (i = 0; i < n; i++) hist[Math.max(0, Math.min(255, g[i] | 0))]++;
  var sum = 0; for (i = 0; i < 256; i++) sum += i * hist[i];
  var wB = 0, sumB = 0, best = -1, T = 127;
  for (i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue;
    var wF = n - wB; if (!wF) break;
    sumB += i * hist[i];
    var mB = sumB / wB, mF = (sum - sumB) / wF, bt = wB * wF * (mB - mF) * (mB - mF);
    if (bt > best) { best = bt; T = i; }
  }
  // 2. kotak area terang (kertas)
  var rows = new Array(h).fill(0), cols = new Array(w).fill(0);
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) if (g[y * w + x] > T) { rows[y]++; cols[x]++; }
  var maxR = Math.max.apply(null, rows), maxC = Math.max.apply(null, cols);
  var y0 = 0, y1 = h - 1, x0 = 0, x1 = w - 1;
  while (y0 < h - 1 && rows[y0] < 0.3 * maxR) y0++;
  while (y1 > y0 && rows[y1] < 0.3 * maxR) y1--;
  while (x0 < w - 1 && cols[x0] < 0.3 * maxC) x0++;
  while (x1 > x0 && cols[x1] < 0.3 * maxC) x1--;
  var luas = (x1 - x0 + 1) * (y1 - y0 + 1) / n;
  if (luas < 0.12) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
  var mx = Math.round(0.06 * (x1 - x0)), my = Math.round(0.06 * (y1 - y0));
  x0 += mx; x1 -= mx; y0 += my; y1 -= my;
  var cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  if (cw < 32 || ch < 32) return '';
  // 3. kecerahan kertas = persentil 90 di dalam kotak
  var h2 = new Array(256).fill(0), cnt = 0;
  for (y = y0; y <= y1; y++) for (x = x0; x <= x1; x++) { h2[Math.max(0, Math.min(255, g[y * w + x] | 0))]++; cnt++; }
  var acc = 0, P = 255;
  for (i = 0; i < 256; i++) { acc += h2[i]; if (acc >= 0.9 * cnt) { P = i; break; } }
  if (P < 60) return '';
  var ambangTinta = 0.62 * P;
  // 4. kerapatan tinta per sel 32x32
  var C = 32, f = new Array(C * C).fill(0), nn = new Array(C * C).fill(0);
  for (y = y0; y <= y1; y++) {
    var cy = Math.min(C - 1, Math.floor((y - y0) * C / ch));
    for (x = x0; x <= x1; x++) {
      var cx = Math.min(C - 1, Math.floor((x - x0) * C / cw)), k = cy * C + cx;
      nn[k]++; if (g[y * w + x] < ambangTinta) f[k]++;
    }
  }
  for (i = 0; i < f.length; i++) f[i] = nn[i] ? f[i] / nn[i] : 0;
  var urut = f.slice().sort(function (a, b) { return a - b; });
  var med = (urut[(f.length >> 1) - 1] + urut[f.length >> 1]) / 2, t = Math.max(med, 0.02);
  var bits = '', ones = 0;
  for (i = 0; i < f.length; i++) { var b = f[i] > t ? 1 : 0; ones += b; bits += b; }
  if (ones < 32 || ones > f.length - 32) return '';
  var hex = '';
  for (i = 0; i < f.length; i += 4) hex += parseInt(bits.substr(i, 4), 2).toString(16);
  return hex;
}
function sidikDariGambar_(img) {
  var c = document.createElement('canvas'); c.width = 320; c.height = 240;
  var cx = c.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, 320, 240);
  cx.drawImage(img, 0, 0, 320, 240);
  return sidikDariRgba_(cx.getImageData(0, 0, 320, 240).data, 320, 240);
}
function thumbDariGambar_(img) {
  var w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) return '';
  var s = Math.min(1, 1600 / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
  var q = [0.85, 0.7, 0.55];
  for (var i = 0; i < q.length; i++) {
    var b = (c.toDataURL('image/jpeg', q[i]).split(',')[1]) || '';
    if (b && b.length <= 1500000) return b;
  }
  return '';
}
/* Satu kali muat gambar -> { dhash, thumb }. Salinan kecil (maks 1600 px, JPEG) dipakai untuk pencarian web & baca label. */
function siapkanScreeningAman_(file) {
  return new Promise(function (resolve) {
    var selesai = false, timer = null, url = '';
    function akhir(v) { if (selesai) return; selesai = true; try { if (timer) clearTimeout(timer); if (url) URL.revokeObjectURL(url); } catch (e) {} resolve(v || { dhash: '', thumb: '' }); }
    try {
      var ok = file && (/^image\/(jpeg|png)$/i.test(file.type || '') || /\.(jpe?g|png)$/i.test(file.name || ''));
      if (!ok) { akhir(null); return; }
      timer = setTimeout(function () { akhir(null); }, 8000);
      url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var dh = '', th = '';
        try { dh = sidikDariGambar_(img); } catch (e) { dh = ''; }
        try { th = thumbDariGambar_(img); } catch (e) { th = ''; }
        akhir({ dhash: dh, thumb: th });
      };
      img.onerror = function () { akhir(null); };
      img.src = url;
    } catch (e) { akhir(null); }
  });
}
function hashGambarAman_(file) { return siapkanScreeningAman_(file).then(function (r) { return r.dhash; }); }

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pesan = $('pesan'), video = $('video'), hasil = $('hasil'), stream = null, blobFoto = null, canvasFoto = null, terkirim = false;
  function say(t, kelas) { pesan.textContent = t; pesan.className = kelas || ''; }
  var n = (new URLSearchParams(location.search).get('n') || '').toLowerCase();
  var cfg = window.SAP_CONFIG || {}, appUrl = String(cfg.APP_URL || '');
  if (!/^[a-f0-9]{32}$/.test(n)) { say('Kode sesi tidak valid. Buka halaman ini lewat tombol "Ambil foto" di portal.', 'err'); return; }
  if (!/^https:\/\/script\.google\.com\//.test(appUrl)) { say('Alamat portal belum diatur (config.js). Hubungi dosen.', 'err'); return; }
  function henti() { try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} stream = null; }
  function bukaKamera() {
    $('aksiKamera').hidden = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say('Browser ini tidak mendukung akses kamera dari halaman web. Gunakan Chrome/Safari terbaru, atau pakai opsi "kamera bawaan perangkat" di portal.', 'err'); return; }
    say('Membuka kamera… izinkan akses kamera jika diminta.');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1920 } }, audio: false }).then(function (s) {
      stream = s; video.srcObject = s; $('stage').hidden = false; $('aksi').hidden = false; video.hidden = false; hasil.hidden = true;
      $('btnAmbil').hidden = false; $('btnUlang').hidden = true; $('btnKirim').hidden = true;
      say('Kamera siap. Posisikan karya lalu tekan "Ambil foto".');
    }).catch(function (e) {
      $('aksiKamera').hidden = false;
      say('Kamera tidak bisa dibuka (' + ((e && e.name) || 'error') + '). Izinkan akses kamera di pengaturan browser untuk situs ini lalu tekan tombol di bawah. Jika tetap gagal, kembali ke portal dan pakai "kamera bawaan perangkat".', 'err');
    });
  }
  $('btnBuka').addEventListener('click', bukaKamera);
  $('btnAmbil').addEventListener('click', function () {
    var w = video.videoWidth, h = video.videoHeight; if (!w || !h) { say('Kamera belum siap, tunggu sebentar.', 'err'); return; }
    var s = Math.min(1, 2400 / Math.max(w, h)), cw = Math.round(w * s), ch = Math.round(h * s);
    var c = document.createElement('canvas'); c.width = cw; c.height = ch; c.getContext('2d').drawImage(video, 0, 0, cw, ch);
    var qs = [0.9, 0.8, 0.7, 0.55], i = 0;
    (function coba() {
      c.toBlob(function (b) {
        if (!b) { say('Gagal membuat foto. Coba lagi.', 'err'); return; }
        if (b.size > 3.5 * 1024 * 1024 && i < qs.length - 1) { i++; coba(); return; }
        blobFoto = b; canvasFoto = c; hasil.src = URL.createObjectURL(b); hasil.hidden = false; video.hidden = true;
        $('btnAmbil').hidden = true; $('btnUlang').hidden = false; $('btnKirim').hidden = false;
        say('Periksa foto: karya terlihat jelas dan tidak buram? Jika ya, tekan "Kirim foto".');
      }, 'image/jpeg', qs[i]);
    })();
  });
  $('btnUlang').addEventListener('click', function () { blobFoto = null; hasil.hidden = true; video.hidden = false; $('btnAmbil').hidden = false; $('btnUlang').hidden = true; $('btnKirim').hidden = true; say('Kamera siap.'); });
  function thumbKecil(c) {
    var s = Math.min(1, 640 / Math.max(c.width, c.height)), t = document.createElement('canvas'); t.width = Math.max(1, Math.round(c.width * s)); t.height = Math.max(1, Math.round(c.height * s));
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    var q = [0.6, 0.45, 0.3, 0.2];
    for (var i = 0; i < q.length; i++) { var d = (t.toDataURL('image/jpeg', q[i]).split(',')[1]) || ''; if (d && d.length <= 60000) return d; }
    return '';
  }
  function keBase64(b) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { var u = String(r.result || ''); res(u.indexOf(',') >= 0 ? u.split(',')[1] : u); }; r.onerror = rej; r.readAsDataURL(b); }); }
  $('btnKirim').addEventListener('click', function () {
    if (!blobFoto || terkirim) return;
    var kirim = $('btnKirim'); kirim.disabled = true; $('btnUlang').disabled = true; say('Mengirim foto…');
    var dh = ''; try { dh = sidikDariGambar_(canvasFoto); } catch (e) { dh = ''; }
    var th = ''; try { th = thumbKecil(canvasFoto); } catch (e) { th = ''; }
    keBase64(blobFoto).then(function (b64) {
      return fetch(appUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ n: n, img: b64, dh: dh, th: th }), redirect: 'follow' })
        .then(function (r) { return r.json(); }, function () { return { tidakPasti: true }; });
    }).then(function (j) {
      if (j && j.ok) { terkirim = true; henti(); $('aksi').hidden = true; say('✔ Foto terkirim. Kembali ke tab portal untuk melanjutkan (centang pernyataan lalu tekan Kirim). Halaman ini boleh ditutup.', 'ok'); try { setTimeout(function () { window.close(); }, 2500); } catch (e) {} }
      else if (j && j.tidakPasti) { kirim.disabled = false; $('btnUlang').disabled = false; say('Tidak dapat memastikan foto terkirim. Cek tab portal: jika pratinjau foto muncul, berarti berhasil. Jika tidak, tekan "Kirim foto" lagi.', 'err'); }
      else { kirim.disabled = false; $('btnUlang').disabled = false; say((j && j.pesan) || 'Foto ditolak oleh server.', 'err'); }
    }).catch(function () { kirim.disabled = false; $('btnUlang').disabled = false; say('Gagal mengirim foto. Periksa koneksi lalu coba lagi.', 'err'); });
  });
  window.addEventListener('pagehide', henti);
  bukaKamera();
})();
</script>
</body>
</html>
